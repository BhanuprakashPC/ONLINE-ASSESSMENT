<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCA Quiz Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>🔐 Quiz Admin Dashboard</h1><p>Local student result records</p></div><a href="index.html">Student Quiz</a></header><main>
<section id="login" class="card login"><h2>Administrator Login</h2><input id="pass" type="password" placeholder="Enter password"><button class="primary full" onclick="login()">Login</button><p id="err" class="error"></p><small>Default password: admin123</small></section>
<section id="dash" class="hidden"><div class="stats"><div><small>Total Attempts</small><b id="total">0</b></div><div><small>Average</small><b id="avg">0%</b></div><div><small>Highest</small><b id="high">0%</b></div></div>
<div class="card"><div class="tools"><h2>Student Results</h2><div><button onclick="load()">↻ Refresh</button><button onclick="downloadCSV()">⬇ Export CSV</button><button class="danger" onclick="clearAll()">Delete All</button></div></div>
<div class="tablewrap"><table><thead><tr><th>#</th><th>Name</th><th>Register No.</th><th>Semester</th><th>Section</th><th>Score</th><th>%</th><th>Date</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty">No attempts recorded.</p></div></section>
</main><script>
const KEY="bcaQuizResults";
function login(){if(document.getElementById("pass").value==="admin123"){sessionStorage.admin="1";show();}else document.getElementById("err").textContent="Incorrect password."}
function show(){document.getElementById("login").classList.add("hidden");document.getElementById("dash").classList.remove("hidden");load()}
function load(){const d=JSON.parse(localStorage.getItem(KEY)||"[]"),rows=document.getElementById("rows");rows.innerHTML="";document.getElementById("empty").style.display=d.length?"none":"block";document.getElementById("total").textContent=d.length;const p=d.map(x=>Number(x.percentage)||0);document.getElementById("avg").textContent=d.length?Math.round(p.reduce((a,b)=>a+b,0)/d.length)+"%":"0%";document.getElementById("high").textContent=d.length?Math.max(...p)+"%":"0%";d.forEach((x,i)=>{const tr=document.createElement("tr");[i+1,x.name,x.registerNo,x.semester,x.section,x.score+"/"+x.total,x.percentage+"%",x.date,x.time].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});rows.appendChild(tr)})}
function clearAll(){if(confirm("Delete all stored results?")){localStorage.removeItem(KEY);localStorage.removeItem("bcaQuizAttempts");load()}}
function downloadCSV(){const d=JSON.parse(localStorage.getItem(KEY)||"[]");if(!d.length)return alert("No results to export.");const head=["Name","Register Number","Semester","Section","Score","Total","Percentage","Date","Time"];const lines=[head,...d.map(x=>[x.name,x.registerNo,x.semester,x.section,x.score,x.total,x.percentage+"%",x.date,x.time])].map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(","));const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="BCA_Quiz_Results.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
if(sessionStorage.admin==="1")show();
</script></body></html>
